name: cd

permissions:
  contents: read
  # Trusted publishing mints a short-lived PyPI token via OIDC — requires
  # id-token write and no PYPI_TOKEN secret.
  id-token: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.21

      # uv_build (the build backend) needs a Python >= 3.14 to build the wheel.
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14

      # Guard against tagging a version that doesn't match pyproject.toml.
      # Plain python3 (not uv run): tomllib is stdlib on the runner's Python,
      # so no environment sync is needed for the check.
      - name: verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag" = "$version" || {
            echo "tag 'v$tag' does not match pyproject.toml version '$version'" >&2
            exit 1
          }

      - name: build sdist and wheel
        run: uv build

      # Publishes dist/* to PyPI. First run needs a one-time setup on PyPI:
      #   1. create the "pyeffect" project (or claim it as the owner),
      #   2. add a trusted publisher for this repo:
      #      owner: Tomperez98, repo: pyeffect, workflow: cd.yml,
      #      environment: (empty).
      # See https://docs.pypi.org/trusted-publishers/ for details.
      - name: publish to PyPI
        run: uv publish --trusted-publishing always
