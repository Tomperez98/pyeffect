name: ci

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.21

      - name: check the lockfile is up to date
        run: uv lock --check

  # Single runner and single Python: pyeffect is pure Python with no
  # platform-specific code, and .python-version (3.12) leaves one
  # interpreter to test. No coverage step — pytest-cov isn't a dependency
  # and there's no Codecov setup on this repo.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.11.21

      # setup-python reads .python-version, so the interpreter and
      # requires-python stay in sync from one place.
      - name: set up python
        uses: actions/setup-python@v5

      - name: install
        run: uv sync --locked

      - name: check linting
        run: uv run ruff check

      # ruff/ty run over the whole workspace: src, tests (including the
      # tests/typing/ fixtures that gate the library's type contracts),
      # and every project under examples/.
      - name: check types
        run: uv run ty check

      - name: run tests
        run: uv run pytest

      # Examples are workspace members that link pyeffect from source;
      # smoke-run the checkout example so it cannot rot against the API.
      - name: run the checkout example
        run: uv run python examples/checkout/main.py
